name: ANC PDF Tarayici

on:
  schedule:
    # Her 2 saatte bir çalıştırır
    - cron: '0 */2 * * *'
  workflow_dispatch: # Github üzerinden manuel tetikleme butonu koyar

jobs:
  tara_ve_bildir:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Çek
      uses: actions/checkout@v3

    - name: Python Ortamını Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        pip install -r requirements.txt

    - name: Tarayıcı Scriptini Çalıştır
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
        SCRAPER_BIN_ID: ${{ secrets.SCRAPER_BIN_ID }}
      run: |
        python scraper.py
